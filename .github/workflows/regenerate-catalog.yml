name: Regenerate catalog

# Receives agents-inc/skills' repository_dispatch, regenerates the catalog and opens a PR.
on:
  repository_dispatch:
    # Must match the event_type the skills repository sends; a mismatch fails silently.
    types: [skills-updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Not cancel-in-progress: a run cancelled between push and PR leaves the branch ahead of it.
concurrency:
  group: regenerate-catalog

env:
  # Stops `bun install` installing husky hooks that would fire on the action's commit.
  HUSKY: 0
  # Kept in step with ci.yml by hand.
  BUN_VERSION: 1.2.6
  NODE_VERSION: 22
  # Fixed branch, so a later dispatch updates the open PR instead of opening another.
  REGEN_BRANCH: automation/catalog-regen
  # Inside the workspace (checkout requires it) but outside the workspace globs and add-paths.
  SKILLS_CHECKOUT: skills-source

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A hand-started run has no payload, so it uses the marketplace tip.
      - name: Resolve the skills commit to regenerate from
        id: trigger
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: echo "ref=${PAYLOAD_SHA:-main}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      # generate:types reads the marketplace. No token needed while agents-inc/skills is public.
      - name: Check out the skills marketplace
        uses: actions/checkout@v5
        with:
          repository: agents-inc/skills
          ref: ${{ steps.trigger.outputs.ref }}
          path: ${{ env.SKILLS_CHECKOUT }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Order matters: schemas and matrix both read what generate:types writes.
      - name: Regenerate the source types
        working-directory: packages/cli
        run: bun run generate:types "$GITHUB_WORKSPACE/$SKILLS_CHECKOUT"

      - name: Regenerate the JSON schemas
        working-directory: packages/cli
        run: bun run generate:schemas

      - name: Regenerate the vendored matrix package
        working-directory: packages/cli
        run: bun run generate:matrix

      # Pinned to a SHA: it holds a token that can write to the default branch.
      - name: Open or update the regeneration pull request
        id: regen
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # PRs opened with GITHUB_TOKEN trigger no CI; set REGEN_PR_TOKEN (a PAT) to get checks.
          token: ${{ secrets.REGEN_PR_TOKEN || github.token }}
          branch: ${{ env.REGEN_BRANCH }}
          base: main
          delete-branch: true
          # Without this the action would also commit the marketplace checkout.
          add-paths: |
            packages/cli/src/cli/types/generated
            packages/cli/src/schemas
            packages/matrix/src/generated
            packages/matrix/src/vendor
          commit-message: |
            chore(catalog): regenerate from agents-inc/skills@${{ steps.trigger.outputs.ref }}

            Written by .github/workflows/regenerate-catalog.yml. Every file in
            this commit comes from a generator in packages/cli/scripts.
          title: "chore(catalog): regenerate from the skills marketplace"
          body: |
            `agents-inc/skills` changed, so this repository's generated catalog
            is out of date. This is what the three generators in `packages/cli`
            emit for
            [`agents-inc/skills@${{ steps.trigger.outputs.ref }}`](https://github.com/agents-inc/skills/commit/${{ steps.trigger.outputs.ref }}).

            **Every file here is generated — review the diff, do not edit the
            branch.** The next dispatch force-updates it and any hand edit is
            gone without a trace.

            To reproduce locally, with a `skills` checkout beside this
            repository:

            ```
            cd packages/cli
            bun run generate:types
            bun run generate:schemas
            bun run generate:matrix
            ```

            The branch is fixed (`${{ env.REGEN_BRANCH }}`), so a later merge in
            the marketplace updates this pull request rather than opening a
            second one beside it.

      - name: Say what happened
        env:
          OPERATION: ${{ steps.regen.outputs.pull-request-operation }}
          NUMBER: ${{ steps.regen.outputs.pull-request-number }}
          URL: ${{ steps.regen.outputs.pull-request-url }}
        run: |
          if [ -z "$OPERATION" ]; then
            echo "The generators produced no change — the catalog already matches the marketplace." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pull request #$NUMBER $OPERATION: $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
