name: Build skill index

# Builds the editor's federated skill index and publishes it to the worker's KV.
# A workflow, not a cron trigger: the crawl exceeds a Worker's 50-subrequest limit.
on:
  # Daily, off the hour. The worker's staleness window assumes this cadence.
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-skill-index

env:
  # Kept in step with ci.yml by hand.
  BUN_VERSION: 1.2.6
  NODE_VERSION: 22
  # Written under RUNNER_TEMP, outside the checkout.
  INDEX_FILE: skill-index.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the Cloudflare credentials; environment secrets are invisible without it.
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Publishes nothing, so a failed crawl leaves the last good index in KV.
      - name: Crawl the allowlisted repositories
        id: crawl
        working-directory: apps/server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build:skill-index "$RUNNER_TEMP/$INDEX_FILE"

      # No TTL: the worker reads `builtAt` to call an old index stale. --remote, or wrangler
      # writes to the local simulated store.
      - name: Publish the index to KV
        working-directory: apps/server
        env:
          INDEX_KEY: ${{ steps.crawl.outputs.key }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler kv key put "$INDEX_KEY" \
            --path "$RUNNER_TEMP/$INDEX_FILE" \
            --binding CONFIGS \
            --env production \
            --remote

      - name: Say what was published
        env:
          INDEX_KEY: ${{ steps.crawl.outputs.key }}
        run: |
          {
            echo "Published \`$INDEX_KEY\` — $(jq '.skills | length' "$RUNNER_TEMP/$INDEX_FILE") skills, built at $(jq -r '.builtAt' "$RUNNER_TEMP/$INDEX_FILE")."
          } >> "$GITHUB_STEP_SUMMARY"
