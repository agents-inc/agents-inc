name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.6
  # Pinned to the CLI's declared floor; its E2E harness spawns the CLI with `node`.
  NODE_VERSION: 22

jobs:
  # Timeouts bound a hang (GitHub's default is six hours), not duration.
  check-web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Cross-workspace checks; fast, so first.
      - name: Workspaces must agree with each other
        run: bun run deps:check

      # Fast staleness checks run before the suites.
      - name: The vendored catalog must match what is committed
        working-directory: packages/cli
        run: bun run generate:matrix:check

      - name: The vendored agent corpus must match what is committed
        working-directory: packages/cli
        run: bun run generate:compile:check

      # The suites apply committed migrations, so only this catches a missing one.
      - name: The migrations must match the schema they are generated from
        working-directory: apps/server
        run: bun run db:generate:check

      # check-cli owns the CLI.
      - run: bun run typecheck --filter='!agents-inc'
      - run: bun run lint --filter='!agents-inc'

      # packages/ui's `test` uses vitest browser mode, so it needs chromium too.
      - run: bunx playwright install --with-deps chromium

      - run: bun run test --filter='!agents-inc'

      - run: bun run test:e2e --filter='!agents-inc'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/editor/playwright-report/
          retention-days: 7

  # Separate job: its pty E2E suite is slow, and deploy does not wait for it.
  check-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run generate:schemas:check
        working-directory: packages/cli

      - run: bun run typecheck --filter=agents-inc
      - run: bun run lint --filter=agents-inc
      - run: bun run test --filter=agents-inc
      - run: bun run test:e2e --filter=agents-inc

      # `test:e2e` does not collect the smoke files. The Claude probes skip here (no `claude`);
      # the Codex probe runs for real.
      - name: The smoke files must at least still load
        working-directory: packages/cli
        run: bun run test:smoke

  # Chromatic baseline diffs for packages/ui. Own job: needs full history, and an outage
  # should not block the type check. Does not gate deploy.
  visual-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Chromatic finds its baseline through git ancestry.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Screenshots are taken in Chromatic's infrastructure, so no `playwright install`.
      # Unguarded: a missing token should fail, not skip green.
      - name: The design system must still look like its baselines
        working-directory: packages/ui
        run: bun run chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  # Argos baseline diffs for the assembled editor. Does not gate deploy.
  visual-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      # The config's webServer builds and serves the app. Unguarded, like visual-ui.
      - name: The editor must still look like its baselines
        working-directory: apps/editor
        run: bun run test:visual
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-editor-results
          path: apps/editor/test-results/
          retention-days: 7

  deploy:
    # check-cli is absent: nothing it covers changes what Cloudflare serves.
    needs: check-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # `wrangler deploy` ships code, not schema; `migrations apply` is idempotent.
      - name: The database must have the schema the code expects
        working-directory: apps/server
        run: bunx wrangler d1 migrations apply agents-inc-db --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: bun run deploy
        env:
          # Public slugs and DSN. Unset DSN disables reporting; unset token skips source maps.
          SENTRY_ORG: vince-inc
          SENTRY_PROJECT: agents-inc-editor
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Absent means PostHog is never downloaded.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
