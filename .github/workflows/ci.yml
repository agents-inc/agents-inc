name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be started by hand. Added after the repository was renamed to
  # agents-inc/agents-inc and the first push afterwards fired no run at all —
  # the commit reached main, Actions stayed enabled and the workflow stayed
  # active, but no event arrived. Without this there was no way to ask for one:
  # re-running an earlier run re-runs that commit, not the one you care about.
  workflow_dispatch:

# A superseded run has nothing to say about the commit that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.6
  # Node is pinned, not inherited. Ink 7 raised the CLI's floor to Node 22, so
  # packages/cli/package.json declares it — but every job here installed bun and
  # nothing else, which left each run on whatever Node ubuntu-latest happened to
  # ship that week. That Node is not incidental: the CLI's E2E harness launches
  # the CLI as a real child process with `pty.spawn("node", …)`, so the runner's
  # Node is the runtime that actually executes the thing under test. Pinning it
  # means CI tests the floor the package declares rather than the image's guess.
  NODE_VERSION: 22

jobs:
  # Every job carries a timeout because GitHub's default is six hours, and this
  # repository has already burned seventy minutes of runner time on one hang.
  # The numbers are measured, not guessed — three green runs on 2026-08-04 put
  # check-web at 4-5 minutes, check-cli at 25-26 and deploy at 30 seconds —
  # then given headroom, because the point is to bound a hang, not to police
  # duration.
  check-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # The two cross-workspace checks, in the job that runs first because they
      # answer in under a second and nothing else here can answer at all. Both
      # compare workspaces to each other — syncpack on dependency ranges, the
      # second on whether each tsconfig.json still extends the shared config —
      # and a defect of that shape is invisible to every per-workspace gate,
      # which is why packages/cli/tsconfig.json could extend nothing for months
      # with tsc, eslint, both suites and turbo typecheck green throughout.
      # Neither check ran anywhere automatic until now; `deps:check` was a
      # script you had to remember.
      - name: Workspaces must agree with each other
        run: bun run deps:check

      # packages/matrix holds a vendored copy of the CLI's catalog, and it goes
      # stale whenever the CLI's types or agent metadata are edited without
      # regenerating it. That used to be a cross-repo dispatch that opened a
      # pull request, because the two halves lived in different repositories.
      # They do not any more: a commit that changes the catalog can carry the
      # regenerated output with it, so this is a check rather than a PR.
      #
      # The writer lives in packages/cli — it is the CLI's own types and agent
      # metadata being vendored — so the check is run from there even though
      # the files it guards belong to the web side. It is CI-safe because every
      # input is in this repository; generate:types, which reads the sibling
      # skills checkout no runner has, deliberately has no check here.
      #
      # It compares in memory and writes nothing, which is why this no longer
      # needs the regenerate-then-git-diff pair it replaced — and it reports a
      # file it emits that is not committed at all, which `git diff` could not
      # see.
      #
      # It runs before the suites on purpose. A stale catalog means something
      # was left uncommitted, and saying so takes seconds — waiting out the E2E
      # run first would only delay the same answer.
      - name: The vendored catalog must match what is committed
        working-directory: packages/cli
        run: bun run generate:matrix:check

      # The CLI is filtered out of every turbo run below: check-cli owns it, and
      # running it in both jobs would pay for it twice.
      - run: bun run typecheck --filter='!agents-inc'
      - run: bun run lint --filter='!agents-inc'

      # Chromium installs before `test`, not just before `test:e2e`: the
      # packages/ui suite runs Storybook stories under vitest browser mode, so
      # plain `test` needs a browser too. Only chromium is configured, so only
      # chromium is installed — once, for both suites.
      - run: bunx playwright install --with-deps chromium

      - run: bun run test --filter='!agents-inc'

      # The Playwright suite is the one that actually covers wiring, so it
      # gates the deploy rather than running after it. (No count here on
      # purpose — the last one this comment carried went stale.)
      - run: bun run test:e2e --filter='!agents-inc'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/editor/playwright-report/
          retention-days: 7

  # The CLI shipped from this repository for eight months with no CI of its own.
  # It has one now, and it is a separate job because its end-to-end suite drives
  # a real pseudo-terminal and takes minutes — long enough that sharing a job
  # with the web checks would hide which half is slow, and long enough that the
  # deploy below deliberately does not wait for it.
  check-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # The committed JSON schemas must match what the Zod schemas generate —
      # the CLI's own generated matrix went stale for weeks because nothing
      # regenerated and compared. The types generator cannot run here (it reads
      # the sibling skills checkout, which the runner does not have); its check
      # lives in prepublishOnly, on the machine that publishes.
      - run: bun run generate:schemas:check
        working-directory: packages/cli

      - run: bun run typecheck --filter=agents-inc
      - run: bun run lint --filter=agents-inc
      - run: bun run test --filter=agents-inc
      - run: bun run test:e2e --filter=agents-inc

  deploy:
    # check-web only, and check-cli deliberately absent. Nothing the CLI's
    # pseudo-terminal suite covers can change what Cloudflare serves, so gating
    # on it would add minutes to every web deploy in exchange for no signal
    # about the thing being deployed. check-cli still runs on the same commit
    # and still turns the commit red when it fails — it just does not hold the
    # door.
    needs: check-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # `turbo deploy` builds first. VITE_API_URL is inlined into the bundle at
      # that point, so it belongs on this step and not on a separate build —
      # and it is declared in turbo.json's `env` so the cache keys on it.
      - run: bun run deploy
        env:
          VITE_API_URL: https://api.agentsinc.sh
          # Slugs are public identifiers — they appear in every Sentry URL, so
          # they are config rather than secrets. The DSN is public too (it
          # ships inside the bundle), but is kept alongside the token so there
          # is one place to look. All four are safe to leave unset: an absent
          # DSN disables reporting, an absent token skips source maps.
          SENTRY_ORG: vince-inc
          # A project slug in an external Sentry account. Renamed there FIRST
          # (2026-08-06), then here — in that order nothing ever points at a
          # slug Sentry does not know, which would fail every source-map
          # upload on a line that reads like a typo.
          SENTRY_PROJECT: agents-inc-editor
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Absent means PostHog is never downloaded at all — the SDK is a
          # separate chunk that only loads when a key exists.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
